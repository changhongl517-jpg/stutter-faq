<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>口吃问答</title>
<meta name="description" content="关于口吃问题的温和、专业解答">
<meta name="theme-color" content="#2E8B6E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root {
    --bg: #F5F7F6;
    --card: #FFFFFF;
    --primary: #2E8B6E;
    --primary-light: #E7F3EE;
    --text: #1F2933;
    --muted: #6B7280;
    --border: #E5E7EB;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  /* 顶部 */
  header {
    position: sticky; top: 0; z-index: 20;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 16px 16px 12px;
  }
  header h1 {
    font-size: 22px; font-weight: 700;
    display: flex; align-items: center; gap: 8px;
  }
  header h1 .logo {
    width: 30px; height: 30px; border-radius: 9px;
    background: var(--primary); color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .search-box { margin-top: 12px; position: relative; }
  .search-box input {
    width: 100%; padding: 11px 14px 11px 38px;
    border: 1px solid var(--border); border-radius: 12px;
    background: var(--bg); font-size: 16px; outline: none;
  }
  .search-box input:focus { border-color: var(--primary); background: #fff; }
  .search-box::before {
    content: "🔍"; position: absolute; left: 13px; top: 50%;
    transform: translateY(-50%); font-size: 15px; opacity: .6;
  }
  /* 主题 chips */
  nav {
    display: flex; gap: 8px; overflow-x: auto;
    padding: 12px 16px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  nav::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0;
    padding: 8px 15px; border-radius: 20px;
    background: var(--card); border: 1px solid var(--border);
    font-size: 14px; color: var(--text); cursor: pointer;
    transition: all .15s;
  }
  .chip.active { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
  /* 问题列表 */
  main { padding: 4px 16px 40px; }
  .count { color: var(--muted); font-size: 13px; padding: 8px 2px 10px; }
  .q-item {
    background: var(--card); border-radius: var(--radius);
    padding: 15px 16px; margin-bottom: 10px;
    border: 1px solid var(--border);
    cursor: pointer; transition: transform .1s;
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
  }
  .q-item:active { transform: scale(.98); background: var(--primary-light); }
  .q-item .txt { font-size: 15px; font-weight: 500; flex: 1; }
  .q-item .arr { color: var(--muted); font-size: 18px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  /* 答案详情页 */
  #detailView {
    position: fixed; inset: 0; z-index: 30;
    background: var(--bg); overflow-y: auto;
    display: none;
  }
  #detailView.show { display: block; }
  .detail-top {
    position: sticky; top: 0; z-index: 5;
    background: var(--card); border-bottom: 1px solid var(--border);
    padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .back-btn {
    width: 32px; height: 32px; border-radius: 50%;
    border: 1px solid var(--border); background: #fff;
    font-size: 16px; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .detail-body { padding: 22px 18px 60px; max-width: 720px; margin: 0 auto; }
  .detail-body h2 { font-size: 20px; line-height: 1.5; margin-bottom: 16px; }
  .detail-body .answer {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px;
    font-size: 15.5px; white-space: pre-wrap;
  }
  .detail-body .answer b { color: var(--primary); }
  .tip {
    margin-top: 18px; padding: 14px; border-radius: var(--radius);
    background: var(--primary-light); color: var(--primary);
    font-size: 13.5px; text-align: center;
  }
</style>
</head>
<body>

<header>
  <h1><span class="logo">语</span>口吃问答</h1>
  <div class="search-box">
    <input id="search" type="search" placeholder="搜索问题，如：能治好吗" autocomplete="off">
  </div>
</header>

<nav id="topics"></nav>

<main id="list">
  <div class="empty">加载中…</div>
</main>

<div id="detailView">
  <div class="detail-top">
    <button class="back-btn" id="backBtn">←</button>
    <strong>解答</strong>
  </div>
  <div class="detail-body">
    <h2 id="dQuestion"></h2>
    <div class="answer" id="dAnswer"></div>
    <div class="tip">💚 口吃不代表表达能力差。<br>你值得被理解，也值得被温柔对待。</div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);

// SF Symbol 名 → emoji（网页没有 SF Symbols，用 emoji 代替）
const ICON_MAP = {
  "questionmark.circle": "❓",
  "magnifyingglass": "🔍",
  "figure.child": "🧒",
  "gearshape": "🛠️",
  "heart": "💚",
  "person": "🧑",
  "stethoscope": "🏥"
};

let TOPICS = [];

async function init() {
  try {
    const res = await fetch('questions.json');
    TOPICS = await res.json();
  } catch (e) {
    $('#list').innerHTML = '<div class="empty">数据加载失败，请刷新重试</div>';
    return;
  }
  renderTopics();
  renderList();
}

// 主题 chips
function renderTopics() {
  const nav = $('#topics');
  nav.innerHTML = '';
  TOPICS.forEach((t, i) => {
    const c = document.createElement('div');
    c.className = 'chip' + (i === 0 ? ' active' : '');
    c.textContent = (ICON_MAP[t.icon] || '') + ' ' + t.name;
    c.dataset.id = t.id;
    c.onclick = () => {
      nav.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
      c.classList.add('active');
      $('#search').value = '';
      renderList();
      window.scrollTo(0, 0);
    };
    nav.appendChild(c);
  });
}

function activeTopic() {
  const a = document.querySelector('.chip.active');
  return TOPICS.find(t => t.id === (a ? a.dataset.id : TOPICS[0].id)) || TOPICS[0];
}

// 问题列表（当前主题 或 搜索结果）
function renderList() {
  const kw = $('#search').value.trim().toLowerCase();
  const list = $('#list');
  list.innerHTML = '';

  let items = [];
  if (kw) {
    items = TOPICS.flatMap(t => t.questions.map(q => ({ q, t })))
      .filter(({ q }) =>
        q.question.toLowerCase().includes(kw) || q.answer.toLowerCase().includes(kw));
  } else {
    const t = activeTopic();
    items = t.questions.map(q => ({ q, t }));
  }

  if (!items.length) {
    list.innerHTML = '<div class="empty">没有找到相关问题</div>';
    return;
  }

  const count = document.createElement('div');
  count.className = 'count';
  count.textContent = kw ? `找到 ${items.length} 个结果` : `${activeTopic().name} · ${items.length} 个问题`;
  list.appendChild(count);

  items.forEach(({ q }) => {
    const d = document.createElement('div');
    d.className = 'q-item';
    d.innerHTML = `<span class="txt"></span><span class="arr">›</span>`;
    d.querySelector('.txt').textContent = q.question;
    d.onclick = () => showDetail(q);
    list.appendChild(d);
  });
}

// 答案详情
function showDetail(q) {
  $('#dQuestion').textContent = q.question;
  $('#dAnswer').innerHTML = formatAnswer(q.answer);
  $('#detailView').classList.add('show');
  $('#detailView').scrollTop = 0;
}

function formatAnswer(text) {
  return text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
}

$('#backBtn').onclick = () => $('#detailView').classList.remove('show');

$('#search').addEventListener('input', renderList);

init();
</script>
</body>
</html>
