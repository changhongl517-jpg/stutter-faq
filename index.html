<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>口吃问答</title>
<meta name="description" content="关于口吃问题的温和、专业解答">
<meta name="theme-color" content="#2E8B6E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root {
    --bg: #F5F7F6;
    --card: #FFFFFF;
    --primary: #2E8B6E;
    --primary-light: #E7F3EE;
    --text: #1F2933;
    --muted: #6B7280;
    --border: #E5E7EB;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  /* 首页：极简提问 */
  .home {
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .logo-badge {
    width: 60px; height: 60px; border-radius: 18px;
    background: linear-gradient(135deg, #218B6B, #38A87E);
    color: #fff; font-size: 28px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px rgba(46,139,110,.25);
    margin-bottom: 24px;
  }
  .greeting {
    font-size: 22px; font-weight: 600; line-height: 1.5;
    color: var(--text); margin-bottom: 30px;
  }
  .ask-box {
    width: 100%; max-width: 460px;
    display: flex; gap: 10px;
  }
  .ask-box input {
    flex: 1; padding: 16px 18px;
    border: 1px solid var(--border); border-radius: 16px;
    background: var(--card); font-size: 17px; outline: none;
    box-shadow: 0 2px 8px rgba(0,0,0,.04);
  }
  .ask-box input:focus { border-color: var(--primary); }
  .ask-box button {
    padding: 0 22px; border: none; border-radius: 16px;
    background: var(--primary); color: #fff;
    font-size: 17px; font-weight: 600; cursor: pointer;
    flex-shrink: 0;
  }
  .ask-box button:active { opacity: .85; }
  .hint { margin-top: 18px; color: var(--muted); font-size: 13px; }
  .hint b { color: var(--primary); font-weight: 500; }

  /* 结果视图 */
  .result { display: none; min-height: 100vh; }
  .result.show { display: block; }
  .result-top {
    position: sticky; top: 0; z-index: 5;
    background: var(--card); border-bottom: 1px solid var(--border);
    padding: 14px 16px;
    display: flex; align-items: flex-start; gap: 12px;
  }
  .back-btn {
    width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid var(--border); background: #fff;
    font-size: 16px; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .you-asked {
    font-size: 15px; font-weight: 600; line-height: 1.5;
    padding-top: 5px; word-break: break-word;
  }
  .you-asked .label { font-size: 12px; color: var(--muted); font-weight: 400; display: block; }
  .answers { padding: 16px 16px 40px; max-width: 720px; margin: 0 auto; }
  .a-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px; margin-bottom: 12px;
  }
  .a-card h3 { font-size: 15px; margin-bottom: 10px; color: var(--primary); }
  .a-card .body { font-size: 15px; white-space: pre-wrap; }
  .a-card .body b { color: var(--primary); }
  .no-result {
    text-align: center; padding: 40px 20px; color: var(--muted);
  }
  .no-result .suggest { margin-top: 14px; font-size: 14px; }
  .no-result .suggest a { color: var(--primary); text-decoration: none; }
  .tip {
    margin: 18px auto 40px; max-width: 720px; margin: 18px 16px 40px;
    padding: 14px; border-radius: var(--radius);
    background: var(--primary-light); color: var(--primary);
    font-size: 13.5px; text-align: center;
  }
</style>
</head>
<body>

<!-- 首页：一句话 + 输入框 -->
<div id="home" class="home">
  <div class="logo-badge">语</div>
  <p class="greeting">口吃只是更习惯，<br>今天你想问什么问题呢？</p>
  <div class="ask-box">
    <input id="ask" type="text" placeholder="输入你的问题…" autocomplete="off">
    <button id="askBtn">问</button>
  </div>
  <div class="hint">试试：<b>口吃能治好吗</b>  ·  <b>孩子口吃怎么办</b></div>
</div>

<!-- 结果视图 -->
<div id="result" class="result">
  <div class="result-top">
    <button class="back-btn" id="backBtn">←</button>
    <div class="you-asked">
      <span class="label">你问的是</span>
      <span id="youAsked"></span>
    </div>
  </div>
  <div class="answers" id="answers"></div>
  <div class="tip">💚 你值得被理解，也值得被温柔对待。</div>
</div>

<script>
const $ = s => document.querySelector(s);
let TOPICS = [];

async function init() {
  try {
    const res = await fetch('questions.json');
    TOPICS = await res.json();
  } catch (e) {
    // 数据加载失败时也能问
  }
}

// 提交提问
async function ask() {
  const q = $('#ask').value.trim();
  if (!q) return;
  $('#youAsked').textContent = q;
  $('#answers').innerHTML = '';
  $('#result').classList.add('show');
  $('#result').scrollTop = 0;
  window.scrollTo(0, 0);

  const matches = search(q);
  const box = $('#answers');

  if (!matches.length) {
    box.innerHTML = `
      <div class="no-result">
        <div>这个问题我还没有现成答案 🙏</div>
        <div class="suggest">不过下面这些常被问到的问题，也许能帮到你：<br>「口吃能治好吗」·「孩子口吃怎么办」<br>「口吃和紧张有关系吗」·「口吃会遗传吗」</div>
      </div>`;
    return;
  }

  matches.forEach(({ qa }) => {
    const card = document.createElement('div');
    card.className = 'a-card';
    card.innerHTML = `<h3></h3><div class="body"></div>`;
    card.querySelector('h3').textContent = qa.question;
    card.querySelector('.body').innerHTML = format(qa.answer);
    box.appendChild(card);
  });
}

// 关键词匹配：中文用"双字窗口"匹配问题+答案，按命中数排序
function search(query) {
  const clean = query.replace(/[\s，。？！、,，.;；:：""''（）()·]+/g, "");
  if (clean.length < 2) return [];

  const grams = [];
  for (let i = 0; i + 2 <= clean.length; i++) grams.push(clean.slice(i, i + 2));
  if (!grams.length) return [];

  const scored = TOPICS.flatMap(t => t.questions.map(qa => {
    const q = qa.question.toLowerCase();
    const a = qa.answer.toLowerCase();
    let score = 0;
    grams.forEach(g => {
      if (q.includes(g)) score += 3;      // 问题标题命中，权重高
      else if (a.includes(g)) score += 1; // 答案命中，权重低
    });
    return { qa, score };
  }));

  const best = scored.filter(x => x.score > 0);
  best.sort((x, y) => y.score - x.score);
  return best.slice(0, 4);
}

function format(text) {
  return text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
}

// 回到首页
function goHome() {
  $('#result').classList.remove('show');
  $('#ask').value = '';
  $('#ask').focus();
}

$('#askBtn').onclick = ask;
$('#ask').addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });
$('#backBtn').onclick = goHome;

init();
</script>
</body>
</html>
