<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>口吃问答</title>
<meta name="description" content="关于口吃问题的温和、专业解答">
<meta name="theme-color" content="#EDEDED">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root {
    --green: #07C160;
    --green-dark: #06AD56;
    --bg: #EDEDED;
    --bubble-white: #FFFFFF;
    --bubble-green: #95EC69;
    --text: #1F1F1F;
    --muted: #8A8A8A;
    --border: #E0E0E0;
    --input-bg: #F7F7F7;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  /* 顶栏 */
  header {
    position: sticky; top: 0; z-index: 20;
    background: var(--input-bg);
    border-bottom: 0.5px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px;
    padding-top: calc(10px + env(safe-area-inset-top));
  }
  .h-avatar {
    width: 32px; height: 32px; border-radius: 6px;
    flex-shrink: 0;
  }
  .h-center { text-align: center; }
  .h-name { font-size: 16px; font-weight: 600; }
  .h-status { font-size: 11px; color: var(--green-dark); height: 14px; }
  .h-back { font-size: 22px; background: none; border: none; cursor: pointer; color: var(--text); width: 32px; }

  /* 聊天区 */
  #chat {
    height: calc(100vh - 118px - env(safe-area-inset-bottom));
    overflow-y: auto;
    padding: 14px 12px;
    padding-bottom: 20px;
    -webkit-overflow-scrolling: touch;
  }
  .msg { display: flex; margin-bottom: 14px; align-items: flex-start; }
  .msg.user { justify-content: flex-end; }
  .avatar {
    width: 38px; height: 38px; border-radius: 6px;
    margin: 0 10px; flex-shrink: 0;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; }
  .avatar.user-av { background: #C9C9C9; font-size: 20px; }
  .msg-col { max-width: 68%; }
  .name { font-size: 12px; color: var(--muted); margin: 0 2px 3px; }
  .bubble {
    padding: 10px 13px;
    font-size: 15.5px;
    line-height: 1.6;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .msg.bot .bubble {
    background: var(--bubble-white);
    border-radius: 4px 10px 10px 10px;
  }
  .msg.user .bubble {
    background: var(--bubble-green);
    border-radius: 10px 4px 10px 10px;
  }
  .msg.bot .bubble h3 { font-size: 14px; color: var(--green-dark); margin-bottom: 4px; }
  .msg.bot .bubble b { color: var(--green-dark); }

  /* 正在输入 */
  .typing-dots { display: inline-flex; gap: 5px; padding: 14px 18px; }
  .typing-dots span {
    width: 8px; height: 8px; border-radius: 50%;
    background: #B0B0B0;
    animation: blink 1.2s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: .2s; }
  .typing-dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,60%,100% {opacity:.3} 30% {opacity:1} }

  /* 底部输入栏 */
  .input-bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
    background: var(--input-bg);
    border-top: 0.5px solid var(--border);
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px;
    padding-bottom: calc(8px + env(safe-area-inset-bottom));
  }
  .input-bar input {
    flex: 1; padding: 9px 14px;
    border: none; border-radius: 6px;
    background: #fff; font-size: 16px; outline: none;
  }
  .input-bar button {
    padding: 9px 18px; border: none; border-radius: 6px;
    background: var(--green); color: #fff;
    font-size: 16px; font-weight: 600; cursor: pointer;
    flex-shrink: 0;
  }
  .input-bar button:active { background: var(--green-dark); }
</style>
</head>
<body>

<header>
  <button class="h-back" id="clearBtn">⋯</button>
  <div class="h-center">
    <div class="h-name">口吃问答</div>
    <div class="h-status" id="hStatus">在线</div>
  </div>
  <img class="h-avatar" src="icons/icon-192.png" alt="口吃问答">
</header>

<div id="chat"></div>

<div class="input-bar">
  <input id="ask" type="text" placeholder="输入你的问题…" autocomplete="off">
  <button id="sendBtn">发送</button>
</div>

<script>
const $ = s => document.querySelector(s);
const chat = $('#chat');
const input = $('#ask');
let TOPICS = [];

const BOT_AV = 'icons/icon-192.png';

// 消息：{ role: 'bot'|'user', qa, text }
function addMsg(role, content) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + (role === 'user' ? 'user' : 'bot');

  if (role === 'user') {
    wrap.innerHTML = `
      <div class="msg-col">
        <div class="bubble"></div>
      </div>
      <div class="avatar user-av">🧑</div>`;
    wrap.querySelector('.bubble').textContent = content;
  } else {
    const { qa, text } = content;
    wrap.innerHTML = `
      <div class="avatar"><img src="${BOT_AV}" alt=""></div>
      <div class="msg-col">
        <div class="name">口吃问答</div>
        <div class="bubble"></div>
      </div>`;
    const bubble = wrap.querySelector('.bubble');
    if (qa) {
      const h3 = document.createElement('h3');
      h3.textContent = qa.question;
      bubble.appendChild(h3);
      bubble.innerHTML += format(qa.answer);
    } else {
      bubble.innerHTML = format(text);
    }
  }
  chat.appendChild(wrap);
  scrollBottom();
  return wrap;
}

// 正在输入指示
function showTyping() {
  $('#hStatus').textContent = '对方正在输入…';
  const t = document.createElement('div');
  t.className = 'msg bot typing';
  t.innerHTML = `
    <div class="avatar"><img src="${BOT_AV}" alt=""></div>
    <div class="msg-col">
      <div class="name">口吃问答</div>
      <div class="bubble typing-dots"><span></span><span></span><span></span></div>
    </div>`;
  chat.appendChild(t);
  scrollBottom();
  return t;
}
function hideTyping(el) { el.remove(); $('#hStatus').textContent = '在线'; }

function scrollBottom() { chat.scrollTop = chat.scrollHeight; }

// 提问流程
function ask() {
  const q = input.value.trim();
  if (!q) return;
  input.value = '';
  addMsg('user', q);

  const typing = showTyping();
  setTimeout(() => {
    hideTyping(typing);
    const matches = search(q);
    if (!matches.length) {
      addMsg('bot', { text: '这个问题我还没有现成答案 🙏\n\n不过你可以试试问这些：\n「口吃能治好吗」\n「孩子口吃怎么办」\n「口吃会遗传吗」\n「口吃和紧张有关系吗」' });
    } else {
      addMsg('bot', { text: '关于「' + q + '」，我找到了这些，你看看 👇' });
      matches.forEach(m => addMsg('bot', { qa: m.qa }));
    }
  }, 1600);
}

// 中文双字窗口匹配，标题加权
function search(query) {
  const clean = query.replace(/[\s，。？！、,，.;；:：""''（）()·]+/g, "");
  if (clean.length < 2) return [];
  const grams = [];
  for (let i = 0; i + 2 <= clean.length; i++) grams.push(clean.slice(i, i + 2));
  if (!grams.length) return [];
  const scored = TOPICS.flatMap(t => t.questions.map(qa => {
    const q = qa.question.toLowerCase();
    const a = qa.answer.toLowerCase();
    let score = 0;
    grams.forEach(g => { if (q.includes(g)) score += 3; else if (a.includes(g)) score += 1; });
    return { qa, score };
  }));
  const best = scored.filter(x => x.score > 0);
  best.sort((x, y) => y.score - x.score);
  return best.slice(0, 4);
}

function format(text) {
  return text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
}

// 初始化：加载数据 + 欢迎消息
async function init() {
  try {
    const res = await fetch('questions.json');
    TOPICS = await res.json();
  } catch (e) { /* 数据加载失败也能问 */ }

  addMsg('bot', { text: '口吃只是更习惯，今天你想问什么问题呢？' });
  input.focus();
}

$('#sendBtn').onclick = ask;
input.addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });
$('#clearBtn').onclick = () => { chat.innerHTML = ''; addMsg('bot', { text: '口吃只是更习惯，今天你想问什么问题呢？' }); };

init();
</script>
</body>
</html>
